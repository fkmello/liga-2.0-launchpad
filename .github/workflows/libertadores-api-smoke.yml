name: Libertadores Cartola API smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/libertadores-api-smoke.yml"
      - "supabase/functions/_shared/providers/cartola-brasileirao/api-client.ts"
      - "supabase/functions/_shared/providers/cartola-brasileirao/adapter-libertadores.ts"

permissions:
  contents: read

jobs:
  read-only-api-smoke:
    name: Read-only Cartola API check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check several teams in a completed mapped round without touching Supabase
        env:
          CARTOLA_TEAM_IDS: "50145709,5085032,85112,13212913,26425633"
          CARTOLA_ROUND: "28"
        run: |
          node --input-type=module <<'NODE'
          const ids = process.env.CARTOLA_TEAM_IDS.split(",").map((id) => id.trim()).filter(Boolean);
          const round = Number(process.env.CARTOLA_ROUND);

          if (ids.length < 3) {
            throw new Error("O smoke test precisa consultar pelo menos 3 times.");
          }

          const results = await Promise.all(ids.map(async (id) => {
            const url = `https://api.cartola.globo.com/time/id/${id}/${round}`;
            const response = await fetch(url, {
              headers: { accept: "application/json" },
              signal: AbortSignal.timeout(15000),
            });

            if (!response.ok) {
              throw new Error(`Time ${id}: Cartola API respondeu HTTP ${response.status} para rodada ${round}.`);
            }

            const data = await response.json();
            if (!data || typeof data !== "object" || Array.isArray(data)) {
              throw new Error(`Time ${id}: a API não retornou um objeto JSON válido.`);
            }
            if (Number(data.rodada_atual) !== round) {
              throw new Error(`Time ${id}: rodada esperada ${round}, recebida ${data.rodada_atual ?? "ausente"}.`);
            }
            if (data.pontos === undefined || data.pontos === null || !Number.isFinite(Number(data.pontos))) {
              throw new Error(`Time ${id}: a resposta não contém pontuação numérica para a rodada concluída.`);
            }

            return {
              teamId: id,
              requestedRound: round,
              responseRound: data.rodada_atual,
              pointsType: typeof data.pontos,
              points: Number(data.pontos),
            };
          }));

          console.log(JSON.stringify({
            endpoint: "/time/id/{id}/{round}",
            teamsChecked: results.length,
            results,
            supabaseAccessed: false,
          }, null, 2));

          console.log(`PASSOU: ${results.length} times confirmaram rodada ${round} e pontuação numérica. Nenhum banco foi acessado.`);
          NODE
