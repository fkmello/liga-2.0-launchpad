name: Test and build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/copa-brasil-shadow-sync]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
